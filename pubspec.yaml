name: wifi_scanner
description: Production WiFi Network IP Scanner similar to Fing
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State management — pure Dart, no Android plugin
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Networking — v5+ declares namespace correctly for AGP 8.3+
  network_info_plus: ^5.0.0

  # Dependency injection — pure Dart
  get_it: ^7.6.4

  # Utils — pure Dart
  dartz: ^0.10.1
  logger: ^2.0.2+1

  # UI — pure Dart
  flutter_animate: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.5
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/oui_database.json
